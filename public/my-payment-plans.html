<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Payment Plans - Photography Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #10b981;
        }

        .plans-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .plan-card {
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .plan-card:hover {
            border-color: #10b981;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.2);
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .plan-client {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .plan-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active {
            background: #d1fae5;
            color: #065f46;
        }

        .status-completed {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-canceled {
            background: #fee2e2;
            color: #991b1b;
        }

        .plan-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            padding: 10px;
            background: #f9fafb;
            border-radius: 5px;
        }

        .detail-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .plan-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #10b981;
            color: white;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: #e0e7ff;
            color: #4338ca;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="secure-app.html" class="back-link">← Back to Dashboard</a>
        
        <div class="header">
            <h1>💳 My Payment Plans</h1>
            <p class="subtitle">Manage all your automated installment payment plans</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">Total Active Plans</div>
                <div class="stat-value" id="stat-active">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Revenue (All Plans)</div>
                <div class="stat-value" id="stat-revenue">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Platform Fees (3%)</div>
                <div class="stat-value" id="stat-fees">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Your Net Earnings</div>
                <div class="stat-value" id="stat-earnings">-</div>
            </div>
        </div>

        <div class="plans-container">
            <h2 style="margin-bottom: 20px;">All Payment Plans</h2>
            <div id="plans-list">
                <div class="loading">Loading payment plans...</div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbtboh1bW6xu9Tz9FILkx_0lzGwXQHjyM",
            authDomain: "photoshcheduleapp.firebaseapp.com",
            projectId: "photoshcheduleapp",
            storageBucket: "photoshcheduleapp.appspot.com",
            messagingSenderId: "1080892259604",
            appId: "1:1080892259604:web:8198de9d7da81c684c1601"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        let currentUser = null;

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                console.error('❌ No authenticated user found');
                alert('Please log in to view payment plans');
                window.location.href = '/';
                return;
            }
            
            currentUser = user;
            console.log('✅ Authenticated user:', user.uid);
            
            try {
                await loadPaymentPlans();
            } catch (error) {
                console.error('❌ Error loading payment plans:', error);
                const plansList = document.getElementById('plans-list');
                plansList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Authentication Error</h3>
                        <p>Unable to load payment plans. Please try logging in again.</p>
                        <br>
                        <a href="/" class="btn btn-primary">Back to Login</a>
                    </div>
                `;
            }
        });

        async function loadPaymentPlans() {
            const plansList = document.getElementById('plans-list');
            
            try {
                const response = await fetch(`/api/installments/photographer/${currentUser.uid}`);
                
                if (!response.ok) {
                    throw new Error('Failed to load payment plans');
                }
                
                const data = await response.json();
                const plans = data.plans || [];
                
                if (plans.length === 0) {
                    plansList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <h3>No Payment Plans Yet</h3>
                            <p>You haven't created any automated payment plans.</p>
                            <br>
                            <a href="secure-app.html" class="btn btn-primary">Go to Dashboard</a>
                        </div>
                    `;
                    updateStats(plans);
                    return;
                }
                
                // Render plans
                plansList.innerHTML = plans.map(plan => renderPlanCard(plan)).join('');
                
                // Update stats
                updateStats(plans);
                
            } catch (error) {
                console.error('Error loading payment plans:', error);
                plansList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Error Loading Plans</h3>
                        <p>${error.message}</p>
                        <br>
                        <button class="btn btn-primary" onclick="window.location.reload()">Retry</button>
                    </div>
                `;
            }
        }

        function renderPlanCard(plan) {
            const statusClass = plan.status === 'active' ? 'status-active' : 
                              plan.status === 'completed' ? 'status-completed' : 
                              'status-canceled';
            
            const firstPaymentDate = new Date(plan.startDate).toLocaleDateString();
            const lastPaymentDate = new Date(plan.endDate).toLocaleDateString();
            const cadenceDisplay = plan.cadence === 'biweekly' ? 'Bi-weekly' : 'Monthly';
            
            const platformFee = (plan.totalAmount * 0.03).toFixed(2);
            const netEarnings = (plan.totalAmount * 0.97).toFixed(2);
            
            return `
                <div class="plan-card">
                    <div class="plan-header">
                        <div class="plan-client">
                            ${plan.customerName || 'Unknown Client'}
                            ${plan.stripeSubscriptionScheduleId ? '<span class="badge">AUTOMATED</span>' : ''}
                        </div>
                        <div class="plan-status ${statusClass}">${plan.status}</div>
                    </div>
                    
                    <div class="plan-details">
                        <div class="detail-item">
                            <div class="detail-label">Total Amount</div>
                            <div class="detail-value">$${plan.totalAmount.toFixed(2)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Per Payment</div>
                            <div class="detail-value">$${plan.perInstallmentAmount.toFixed(2)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Payments</div>
                            <div class="detail-value">${plan.numberOfPayments} ${cadenceDisplay}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Platform Fee (3%)</div>
                            <div class="detail-value" style="color: #f59e0b;">-$${platformFee}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Your Net Earnings</div>
                            <div class="detail-value" style="color: #10b981;">$${netEarnings}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">First Payment</div>
                            <div class="detail-value">${firstPaymentDate}</div>
                        </div>
                    </div>
                    
                    <div class="plan-actions">
                        <button class="btn btn-primary" onclick="viewPlanDetails('${plan.id}')">📊 View Details</button>
                        ${plan.stripeSubscriptionScheduleId ? `
                            <a href="https://dashboard.stripe.com/subscriptions/schedules/${plan.stripeSubscriptionScheduleId}" target="_blank" class="btn btn-secondary">
                                🔗 View in Stripe
                            </a>
                        ` : ''}
                        <button class="btn btn-secondary" onclick="sharePlan('${plan.id}')">📧 Share Link</button>
                    </div>
                </div>
            `;
        }

        function updateStats(plans) {
            const activePlans = plans.filter(p => p.status === 'active').length;
            const totalRevenue = plans.reduce((sum, p) => sum + (p.totalAmount || 0), 0);
            const platformFees = totalRevenue * 0.03;
            const netEarnings = totalRevenue * 0.97;
            
            document.getElementById('stat-active').textContent = activePlans;
            document.getElementById('stat-revenue').textContent = `$${totalRevenue.toFixed(2)}`;
            document.getElementById('stat-fees').textContent = `-$${platformFees.toFixed(2)}`;
            document.getElementById('stat-earnings').textContent = `$${netEarnings.toFixed(2)}`;
        }

        window.viewPlanDetails = function(planId) {
            window.location.href = `/payment-plan-details.html?planId=${planId}`;
        };

        window.sharePlan = async function(planId) {
            const baseUrl = window.location.origin;
            const link = `${baseUrl}/installment-setup.html?planId=${planId}`;
            
            try {
                await navigator.clipboard.writeText(link);
                alert('✅ Payment link copied to clipboard!\n\nShare this link with your client to set up their payment method.');
            } catch (error) {
                prompt('Copy this link to share with your client:', link);
            }
        };
    </script>
</body>
</html>

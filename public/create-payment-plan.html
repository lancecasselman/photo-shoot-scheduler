<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Automated Payment Plan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: #2d2d2d;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        h1 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .session-info {
            background: rgba(33,150,243,0.1);
            border: 1px solid rgba(33,150,243,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .session-info h3 {
            color: #2196F3;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .session-detail {
            color: #ccc;
            margin: 5px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #d4af37;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            color: #f5f5f5;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #d4af37;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4bc 100%);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212,175,55,0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #555;
            color: #fff;
        }
        
        .error-message {
            background: rgba(255,68,68,0.1);
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #ff4444;
        }
        
        .success-message {
            background: rgba(76,175,80,0.1);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #4CAF50;
        }
        
        .payment-link-section {
            background: rgba(33,150,243,0.1);
            border: 2px solid #2196F3;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .payment-link-section h3 {
            color: #2196F3;
            margin-bottom: 15px;
        }
        
        .link-box {
            background: #1a1a1a;
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            word-break: break-all;
            color: #d4af37;
            font-family: monospace;
        }
        
        .copy-btn {
            background: #2196F3;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .copy-btn:hover {
            background: #1976D2;
        }
        
        .calculated-preview {
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .calculated-preview h4 {
            color: #d4af37;
            margin-bottom: 10px;
        }
        
        .preview-detail {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Create Payment Plan</h1>
        <p class="subtitle">Set up automated billing for your client</p>
        
        <div class="session-info" id="sessionInfo">
            <h3>📸 Session Information</h3>
            <div class="session-detail">Loading...</div>
        </div>
        
        <form id="planForm">
            <div class="form-group">
                <label for="totalAmount">Total Amount ($)</label>
                <input type="number" id="totalAmount" min="1" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label for="cadence">Payment Frequency</label>
                <select id="cadence" required>
                    <option value="monthly">Monthly</option>
                    <option value="biweekly">Bi-weekly (Every 2 weeks)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="numberOfPayments">Number of Payments</label>
                <input type="number" id="numberOfPayments" min="2" max="24" required>
            </div>
            
            <div class="form-group">
                <label for="startDate">First Payment Date</label>
                <input type="date" id="startDate" required>
            </div>
            
            <div class="calculated-preview" id="preview" style="display: none;">
                <h4>📊 Payment Preview</h4>
                <div class="preview-detail">
                    <span>Payment Amount:</span>
                    <span id="previewAmount">$0.00</span>
                </div>
                <div class="preview-detail">
                    <span>Total Payments:</span>
                    <span id="previewCount">0</span>
                </div>
                <div class="preview-detail">
                    <span>Final Payment:</span>
                    <span id="previewEndDate">-</span>
                </div>
            </div>
            
            <button type="submit" class="btn" id="createBtn">Create Payment Plan</button>
            <button type="button" class="btn btn-secondary" onclick="window.close()">Cancel</button>
        </form>
        
        <div id="message"></div>
        
        <div class="payment-link-section" id="linkSection" style="display: none;">
            <h3>✅ Payment Plan Created!</h3>
            <p style="color: #ccc; margin-bottom: 15px;">Share this link with your client to set up automated billing:</p>
            <div class="link-box" id="paymentLink"></div>
            <button class="copy-btn" onclick="copyLink()">📋 Copy Link</button>
            <button class="btn" onclick="window.close()" style="margin-top: 15px;">Close Window</button>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('sessionId');
        
        let sessionData = null;
        
        // Load session data
        async function loadSession() {
            try {
                const response = await fetch('/api/sessions');
                if (!response.ok) throw new Error('Failed to load sessions');
                
                const sessions = await response.json();
                sessionData = sessions.find(s => s.id === sessionId);
                
                if (!sessionData) {
                    throw new Error('Session not found');
                }
                
                // Display session info
                document.getElementById('sessionInfo').innerHTML = `
                    <h3>📸 Session Information</h3>
                    <div class="session-detail"><strong>Client:</strong> ${sessionData.clientName}</div>
                    <div class="session-detail"><strong>Email:</strong> ${sessionData.email}</div>
                    <div class="session-detail"><strong>Phone:</strong> ${sessionData.phoneNumber}</div>
                    <div class="session-detail"><strong>Session:</strong> ${sessionData.sessionType}</div>
                    <div class="session-detail"><strong>Price:</strong> $${sessionData.price}</div>
                `;
                
                // Pre-fill total amount from session price
                document.getElementById('totalAmount').value = sessionData.price;
                
                // Set minimum start date to today
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('startDate').min = today;
                document.getElementById('startDate').value = today;
                
                updatePreview();
                
            } catch (error) {
                console.error('Error loading session:', error);
                document.getElementById('message').innerHTML = `<div class="error-message">⚠️ ${error.message}</div>`;
            }
        }
        
        // Update payment preview
        function updatePreview() {
            const totalAmount = parseFloat(document.getElementById('totalAmount').value) || 0;
            const numberOfPayments = parseInt(document.getElementById('numberOfPayments').value) || 0;
            const startDate = document.getElementById('startDate').value;
            const cadence = document.getElementById('cadence').value;
            
            if (totalAmount > 0 && numberOfPayments > 0 && startDate) {
                const paymentAmount = (totalAmount / numberOfPayments).toFixed(2);
                const start = new Date(startDate);
                
                // Calculate end date
                let endDate = new Date(start);
                const increment = cadence === 'biweekly' ? 14 : 30;
                endDate.setDate(endDate.getDate() + (increment * (numberOfPayments - 1)));
                
                document.getElementById('previewAmount').textContent = `$${paymentAmount}`;
                document.getElementById('previewCount').textContent = numberOfPayments;
                document.getElementById('previewEndDate').textContent = endDate.toLocaleDateString();
                document.getElementById('preview').style.display = 'block';
            }
        }
        
        // Add event listeners for live preview
        ['totalAmount', 'numberOfPayments', 'startDate', 'cadence'].forEach(id => {
            document.getElementById(id).addEventListener('input', updatePreview);
        });
        
        // Handle form submission
        document.getElementById('planForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const createBtn = document.getElementById('createBtn');
            const messageDiv = document.getElementById('message');
            
            createBtn.disabled = true;
            messageDiv.innerHTML = '<p style="color: #d4af37;">⏳ Creating payment plan...</p>';
            
            try {
                const totalAmount = parseFloat(document.getElementById('totalAmount').value);
                const numberOfPayments = parseInt(document.getElementById('numberOfPayments').value);
                const cadence = document.getElementById('cadence').value;
                const startDate = document.getElementById('startDate').value;
                
                // Calculate payment amount
                const perInstallmentAmount = (totalAmount / numberOfPayments).toFixed(2);
                
                // Create payment plan
                const response = await fetch('/api/installments/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        totalAmount: totalAmount,
                        numberOfPayments: numberOfPayments,
                        perInstallmentAmount: parseFloat(perInstallmentAmount),
                        cadence: cadence,
                        startDate: startDate,
                        customerName: sessionData.clientName,
                        customerEmail: sessionData.email,
                        customerPhone: sessionData.phoneNumber
                    })
                });
                
                const result = await response.json();
                
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to create payment plan');
                }
                
                // Show payment link
                const domain = window.location.origin;
                const paymentLink = `${domain}/installment-setup.html?planId=${result.planId}`;
                
                document.getElementById('paymentLink').textContent = paymentLink;
                document.getElementById('planForm').style.display = 'none';
                document.getElementById('linkSection').style.display = 'block';
                messageDiv.innerHTML = '';
                
                // Store link for copying
                window.currentPaymentLink = paymentLink;
                
            } catch (error) {
                console.error('Error creating payment plan:', error);
                messageDiv.innerHTML = `<div class="error-message">⚠️ ${error.message}</div>`;
                createBtn.disabled = false;
            }
        });
        
        // Copy link to clipboard
        function copyLink() {
            const link = window.currentPaymentLink;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Payment link copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy link. Please copy manually.');
            });
        }
        
        // Initialize
        if (!sessionId) {
            document.getElementById('message').innerHTML = '<div class="error-message">⚠️ No session ID provided</div>';
        } else {
            loadSession();
        }
    </script>
</body>
</html>

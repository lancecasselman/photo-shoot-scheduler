<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Automated Payment Plan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: #2d2d2d;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        h1 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .session-info {
            background: rgba(33,150,243,0.1);
            border: 1px solid rgba(33,150,243,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .session-info h3 {
            color: #2196F3;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .session-detail {
            color: #ccc;
            margin: 5px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #d4af37;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 2px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            color: #f5f5f5;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #d4af37;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4bc 100%);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212,175,55,0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #555;
            color: #fff;
        }
        
        .error-message {
            background: rgba(255,68,68,0.1);
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #ff4444;
        }
        
        .success-message {
            background: rgba(76,175,80,0.1);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #4CAF50;
        }
        
        .payment-link-section {
            background: rgba(33,150,243,0.1);
            border: 2px solid #2196F3;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .payment-link-section h3 {
            color: #2196F3;
            margin-bottom: 15px;
        }
        
        .link-box {
            background: #1a1a1a;
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            word-break: break-all;
            color: #d4af37;
            font-family: monospace;
        }
        
        .copy-btn {
            background: #2196F3;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .copy-btn:hover {
            background: #1976D2;
        }
        
        .calculated-preview {
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .calculated-preview h4 {
            color: #d4af37;
            margin-bottom: 10px;
        }
        
        .preview-detail {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: #ccc;
        }
        
        .payment-method-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .payment-method-option {
            flex: 1;
            padding: 15px;
            background: rgba(212,175,55,0.05);
            border: 2px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .payment-method-option input[type="radio"] {
            width: auto;
            margin-right: 8px;
        }
        
        .payment-method-option:hover {
            background: rgba(212,175,55,0.1);
        }
        
        .payment-method-option.active {
            background: rgba(212,175,55,0.15);
            border-color: #d4af37;
        }
        
        .payment-schedule-calculator {
            background: rgba(33,150,243,0.1);
            border: 2px solid rgba(33,150,243,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .payment-schedule-calculator h3 {
            color: #2196F3;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .schedule-summary {
            background: rgba(212,175,55,0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .schedule-summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: #f5f5f5;
            font-weight: 600;
        }
        
        .payment-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .payment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        
        .payment-number {
            color: #d4af37;
            font-weight: 600;
            min-width: 100px;
        }
        
        .payment-date {
            color: #aaa;
            flex: 1;
        }
        
        .payment-amount {
            color: #4CAF50;
            font-weight: 600;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Create Payment Plan</h1>
        <p class="subtitle">Set up automated billing for your client</p>
        
        <div class="session-info" id="sessionInfo">
            <h3>📸 Session Information</h3>
            <div class="session-detail">Loading...</div>
        </div>
        
        <form id="planForm">
            <div class="form-group">
                <label for="totalAmount">Total Amount ($)</label>
                <input type="number" id="totalAmount" min="1" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label for="cadence">Payment Frequency</label>
                <select id="cadence" required>
                    <option value="monthly">Monthly</option>
                    <option value="biweekly">Bi-weekly (Every 2 weeks)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Payment Schedule Method</label>
                <div class="payment-method-selector">
                    <label class="payment-method-option active" id="methodNumberOption">
                        <input type="radio" name="scheduleMethod" value="number" checked>
                        Number of Payments
                    </label>
                    <label class="payment-method-option" id="methodDateOption">
                        <input type="radio" name="scheduleMethod" value="daterange">
                        Date Range
                    </label>
                </div>
            </div>
            
            <div class="form-group" id="numberOfPaymentsGroup">
                <label for="numberOfPayments">Number of Payments</label>
                <input type="number" id="numberOfPayments" min="2" max="24">
            </div>
            
            <div class="form-group" id="dateRangeGroup" style="display: none;">
                <label for="startDate">First Payment Date</label>
                <input type="date" id="startDate" class="date-input">
                
                <label for="endDate" style="margin-top: 15px;">Last Payment Date</label>
                <input type="date" id="endDate" class="date-input">
            </div>
            
            <div class="form-group" id="startDateOnlyGroup">
                <label for="startDateOnly">First Payment Date</label>
                <input type="date" id="startDateOnly">
            </div>
            
            <div class="payment-schedule-calculator" id="calculator" style="display: none;">
                <h3>💰 Payment Calculator</h3>
                <div class="schedule-summary">
                    <div class="schedule-summary-row">
                        <span>Total Amount:</span>
                        <span id="calcTotal">$0.00</span>
                    </div>
                    <div class="schedule-summary-row">
                        <span>Number of Payments:</span>
                        <span id="calcCount">0</span>
                    </div>
                    <div class="schedule-summary-row">
                        <span>Payment Amount:</span>
                        <span id="calcAmount">$0.00</span>
                    </div>
                </div>
                <div class="payment-list" id="paymentList"></div>
            </div>
            
            <button type="submit" class="btn" id="createBtn">Create Payment Plan</button>
            <button type="button" class="btn btn-secondary" onclick="window.close()">Cancel</button>
        </form>
        
        <div id="message"></div>
        
        <div class="payment-link-section" id="linkSection" style="display: none;">
            <h3>✅ Payment Plan Created!</h3>
            <p style="color: #ccc; margin-bottom: 15px;">Share this link with your client to set up automated billing:</p>
            <div class="link-box" id="paymentLink"></div>
            <button class="copy-btn" onclick="copyLink()">📋 Copy Link</button>
            <button class="btn" onclick="window.close()" style="margin-top: 15px;">Close Window</button>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('sessionId');
        
        let sessionData = null;
        let scheduleMethod = 'number'; // 'number' or 'daterange'
        
        // Load session data
        async function loadSession() {
            try {
                const response = await fetch('/api/sessions');
                if (!response.ok) throw new Error('Failed to load sessions');
                
                const sessions = await response.json();
                sessionData = sessions.find(s => s.id === sessionId);
                
                if (!sessionData) {
                    throw new Error('Session not found');
                }
                
                // Display session info
                document.getElementById('sessionInfo').innerHTML = `
                    <h3>📸 Session Information</h3>
                    <div class="session-detail"><strong>Client:</strong> ${sessionData.clientName}</div>
                    <div class="session-detail"><strong>Email:</strong> ${sessionData.email || 'Not provided'}</div>
                    <div class="session-detail"><strong>Phone:</strong> ${sessionData.phoneNumber || 'Not provided'}</div>
                    <div class="session-detail"><strong>Session:</strong> ${sessionData.sessionType}</div>
                    <div class="session-detail"><strong>Price:</strong> $${sessionData.price}</div>
                `;
                
                // Pre-fill total amount from session price
                document.getElementById('totalAmount').value = sessionData.price;
                
                // Set minimum start date to today
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('startDate').min = today;
                document.getElementById('startDate').value = today;
                document.getElementById('startDateOnly').min = today;
                document.getElementById('startDateOnly').value = today;
                document.getElementById('endDate').min = today;
                
                updateCalculator();
                
            } catch (error) {
                console.error('Error loading session:', error);
                document.getElementById('message').innerHTML = `<div class="error-message">⚠️ ${error.message}</div>`;
            }
        }
        
        // Handle schedule method toggle
        document.querySelectorAll('input[name="scheduleMethod"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                scheduleMethod = e.target.value;
                
                // Update UI
                document.getElementById('methodNumberOption').classList.toggle('active', scheduleMethod === 'number');
                document.getElementById('methodDateOption').classList.toggle('active', scheduleMethod === 'daterange');
                
                // Show/hide appropriate inputs
                if (scheduleMethod === 'number') {
                    document.getElementById('numberOfPaymentsGroup').style.display = 'block';
                    document.getElementById('startDateOnlyGroup').style.display = 'block';
                    document.getElementById('dateRangeGroup').style.display = 'none';
                } else {
                    document.getElementById('numberOfPaymentsGroup').style.display = 'none';
                    document.getElementById('startDateOnlyGroup').style.display = 'none';
                    document.getElementById('dateRangeGroup').style.display = 'block';
                }
                
                updateCalculator();
            });
        });
        
        // Calculate number of payments from date range
        function calculatePaymentsFromDateRange(startDate, endDate, cadence) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            
            if (end <= start) return 0;
            
            if (cadence === 'biweekly') {
                // Count bi-weekly periods: one payment on start, then every 14 days
                let count = 1;
                let current = new Date(start);
                let lastPaymentDate = new Date(start);
                
                while (true) {
                    current.setDate(current.getDate() + 14);
                    if (current > end) {
                        // Check if there's significant time between last payment and end date
                        // If more than 7 days remaining, add a final payment
                        const daysRemaining = Math.floor((end - lastPaymentDate) / (1000 * 60 * 60 * 24));
                        if (daysRemaining >= 7) {
                            count++;
                        }
                        break;
                    }
                    count++;
                    lastPaymentDate = new Date(current);
                }
                return count;
            } else {
                // Monthly: count payment dates, including partial final month
                let count = 1; // First payment on start date
                let current = new Date(start);
                let lastPaymentDate = new Date(start);
                
                while (true) {
                    current.setMonth(current.getMonth() + 1);
                    if (current > end) {
                        // Check if there's a partial month remaining (at least 7 days)
                        const daysRemaining = Math.floor((end - lastPaymentDate) / (1000 * 60 * 60 * 24));
                        if (daysRemaining >= 7) {
                            count++;
                        }
                        break;
                    }
                    count++;
                    lastPaymentDate = new Date(current);
                }
                return count;
            }
        }
        
        // Update payment calculator
        function updateCalculator() {
            const totalAmount = parseFloat(document.getElementById('totalAmount').value) || 0;
            const cadence = document.getElementById('cadence').value;
            
            let numberOfPayments = 0;
            let startDate = null;
            let endDate = null;
            
            if (scheduleMethod === 'number') {
                numberOfPayments = parseInt(document.getElementById('numberOfPayments').value) || 0;
                startDate = document.getElementById('startDateOnly').value;
            } else {
                const start = document.getElementById('startDate').value;
                const end = document.getElementById('endDate').value;
                
                if (start && end) {
                    numberOfPayments = calculatePaymentsFromDateRange(start, end, cadence);
                    startDate = start;
                    endDate = end;
                }
            }
            
            if (totalAmount > 0 && numberOfPayments > 0 && startDate) {
                // Calculate payment amounts
                const basePayment = Math.floor((totalAmount * 100) / numberOfPayments) / 100;
                const remainder = totalAmount - (basePayment * numberOfPayments);
                const lastPayment = basePayment + remainder;
                
                // Generate payment schedule
                const payments = [];
                let currentDate = new Date(startDate);
                const userEndDate = endDate ? new Date(endDate) : null;
                
                for (let i = 0; i < numberOfPayments; i++) {
                    const amount = (i === numberOfPayments - 1) ? lastPayment : basePayment;
                    
                    // For date range mode, cap the final payment at the end date
                    if (scheduleMethod === 'daterange' && i === numberOfPayments - 1 && userEndDate) {
                        // If this is a partial period payment, use the end date
                        if (currentDate > userEndDate) {
                            currentDate = userEndDate;
                        }
                    }
                    
                    payments.push({
                        number: i + 1,
                        date: new Date(currentDate),
                        amount: amount
                    });
                    
                    // Increment date for next iteration
                    if (i < numberOfPayments - 1) {
                        if (cadence === 'biweekly') {
                            currentDate.setDate(currentDate.getDate() + 14);
                        } else {
                            currentDate.setMonth(currentDate.getMonth() + 1);
                        }
                    }
                }
                
                // Update summary
                document.getElementById('calcTotal').textContent = `$${totalAmount.toFixed(2)}`;
                document.getElementById('calcCount').textContent = numberOfPayments;
                document.getElementById('calcAmount').textContent = `$${basePayment.toFixed(2)}`;
                
                // Build payment list
                const paymentListHTML = payments.map(p => `
                    <div class="payment-item">
                        <div class="payment-number">Payment ${p.number}</div>
                        <div class="payment-date">${p.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                        <div class="payment-amount">$${p.amount.toFixed(2)}</div>
                    </div>
                `).join('');
                
                document.getElementById('paymentList').innerHTML = paymentListHTML;
                document.getElementById('calculator').style.display = 'block';
            } else {
                document.getElementById('calculator').style.display = 'none';
            }
        }
        
        // Add event listeners for live calculator
        ['totalAmount', 'numberOfPayments', 'startDateOnly', 'cadence', 'startDate', 'endDate'].forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                element.addEventListener('input', updateCalculator);
                element.addEventListener('change', updateCalculator);
            }
        });
        
        // Handle form submission
        document.getElementById('planForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const createBtn = document.getElementById('createBtn');
            const messageDiv = document.getElementById('message');
            
            // Get values based on schedule method
            const totalAmount = parseFloat(document.getElementById('totalAmount').value);
            const cadence = document.getElementById('cadence').value;
            
            let numberOfPayments = 0;
            let startDate = null;
            
            if (scheduleMethod === 'number') {
                numberOfPayments = parseInt(document.getElementById('numberOfPayments').value);
                startDate = document.getElementById('startDateOnly').value;
                
                if (!numberOfPayments || numberOfPayments < 2) {
                    messageDiv.innerHTML = '<div class="error-message">⚠️ Please enter at least 2 payments</div>';
                    return;
                }
            } else {
                const start = document.getElementById('startDate').value;
                const end = document.getElementById('endDate').value;
                
                if (!start || !end) {
                    messageDiv.innerHTML = '<div class="error-message">⚠️ Please select both start and end dates</div>';
                    return;
                }
                
                numberOfPayments = calculatePaymentsFromDateRange(start, end, cadence);
                startDate = start;
                
                if (numberOfPayments < 2) {
                    messageDiv.innerHTML = '<div class="error-message">⚠️ Date range must allow at least 2 payments</div>';
                    return;
                }
            }
            
            createBtn.disabled = true;
            messageDiv.innerHTML = '<p style="color: #d4af37;">⏳ Creating payment plan...</p>';
            
            try {
                // Calculate payment amount
                const perInstallmentAmount = (totalAmount / numberOfPayments).toFixed(2);
                
                // Create payment plan
                const response = await fetch('/api/installments/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        totalAmount: totalAmount,
                        numberOfPayments: numberOfPayments,
                        perInstallmentAmount: parseFloat(perInstallmentAmount),
                        cadence: cadence,
                        startDate: startDate,
                        customerName: sessionData.clientName,
                        customerEmail: sessionData.email,
                        customerPhone: sessionData.phoneNumber
                    })
                });
                
                const result = await response.json();
                
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to create payment plan');
                }
                
                // Show payment link
                const domain = window.location.origin;
                const paymentLink = `${domain}/installment-setup.html?planId=${result.planId}`;
                
                document.getElementById('paymentLink').textContent = paymentLink;
                document.getElementById('planForm').style.display = 'none';
                document.getElementById('linkSection').style.display = 'block';
                messageDiv.innerHTML = '';
                
                // Store link for copying
                window.currentPaymentLink = paymentLink;
                
            } catch (error) {
                console.error('Error creating payment plan:', error);
                messageDiv.innerHTML = `<div class="error-message">⚠️ ${error.message}</div>`;
                createBtn.disabled = false;
            }
        });
        
        // Copy link to clipboard
        function copyLink() {
            const link = window.currentPaymentLink;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Payment link copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy link. Please copy manually.');
            });
        }
        
        // Initialize
        if (!sessionId) {
            document.getElementById('message').innerHTML = '<div class="error-message">⚠️ No session ID provided</div>';
        } else {
            loadSession();
        }
    </script>
</body>
</html>

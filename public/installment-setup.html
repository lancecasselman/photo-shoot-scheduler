<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Setup - Automated Billing</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: #2d2d2d;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        h1 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .plan-summary {
            background: rgba(212,175,55,0.1);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .plan-summary h3 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .plan-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .plan-detail:last-child {
            border-bottom: none;
        }
        
        .label {
            color: #aaa;
        }
        
        .value {
            color: #fff;
            font-weight: 500;
        }
        
        #card-element {
            background: #1a1a1a;
            padding: 15px;
            border: 2px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        #card-errors {
            color: #ff4444;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4bc 100%);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212,175,55,0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #d4af37;
        }
        
        .error-message {
            background: rgba(255,68,68,0.1);
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #ff4444;
        }
        
        .success-message {
            background: rgba(76,175,80,0.1);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Automated Payment Setup</h1>
        <p class="subtitle">Set up automated billing for your payment plan</p>
        
        <div class="plan-summary" id="planSummary">
            <h3>📋 Payment Plan Details</h3>
            <div class="plan-detail">
                <span class="label">Total Amount:</span>
                <span class="value" id="totalAmount">-</span>
            </div>
            <div class="plan-detail">
                <span class="label">Payment Frequency:</span>
                <span class="value" id="cadence">-</span>
            </div>
            <div class="plan-detail">
                <span class="label">Total Payments:</span>
                <span class="value" id="totalPayments">-</span>
            </div>
            <div class="plan-detail">
                <span class="label">Payment Amount:</span>
                <span class="value" id="paymentAmount">-</span>
            </div>
            <div class="plan-detail">
                <span class="label">First Payment:</span>
                <span class="value" id="firstPayment">-</span>
            </div>
        </div>
        
        <form id="payment-form">
            <label for="card-element" style="display: block; margin-bottom: 10px; color: #d4af37; font-weight: 600;">
                💳 Payment Method
            </label>
            <div id="card-element"></div>
            <div id="card-errors" role="alert"></div>
            
            <button type="submit" class="btn" id="submit-button">
                Set Up Automated Billing
            </button>
        </form>
        
        <div class="loading" id="loading">
            <p>⏳ Setting up your automated payment plan...</p>
        </div>
        
        <div id="message"></div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        
        // Get pending plan data from session storage
        const planData = JSON.parse(sessionStorage.getItem('pendingInstallmentPlan') || '{}');
        
        if (!planData.sessionId) {
            document.getElementById('message').innerHTML = '<div class="error-message">⚠️ No payment plan data found. Please start over.</div>';
            document.getElementById('payment-form').style.display = 'none';
            setTimeout(() => window.location.href = '/app', 3000);
        }
        
        // Fetch Stripe publishable key and preview
        let stripe, cardElement;
        
        async function initialize() {
            try {
                // Get preview
                const previewResponse = await fetch('/api/installments/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        totalAmount: planData.totalAmount,
                        cadence: planData.cadence,
                        startDate: planData.startDate,
                        numberOfPayments: planData.numberOfPayments
                    })
                });
                
                const preview = await previewResponse.json();
                
                // Update UI with plan details
                document.getElementById('totalAmount').textContent = `$${preview.totalAmount}`;
                document.getElementById('cadence').textContent = preview.cadence.charAt(0).toUpperCase() + preview.cadence.slice(1);
                document.getElementById('totalPayments').textContent = preview.numberOfPayments;
                document.getElementById('paymentAmount').textContent = `$${preview.perInstallmentAmount}`;
                document.getElementById('firstPayment').textContent = new Date(preview.startDate).toLocaleDateString();
                
                // Initialize Stripe
                const keyResponse = await fetch('/api/stripe-publishable-key');
                const { publishableKey } = await keyResponse.json();
                
                stripe = Stripe(publishableKey);
                const elements = stripe.elements();
                
                cardElement = elements.create('card', {
                    style: {
                        base: {
                            color: '#f5f5f5',
                            fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif',
                            fontSize: '16px',
                            '::placeholder': {
                                color: '#aaa'
                            }
                        },
                        invalid: {
                            color: '#ff4444'
                        }
                    }
                });
                
                cardElement.mount('#card-element');
                
                cardElement.on('change', (event) => {
                    const displayError = document.getElementById('card-errors');
                    if (event.error) {
                        displayError.textContent = event.error.message;
                    } else {
                        displayError.textContent = '';
                    }
                });
                
            } catch (error) {
                console.error('Initialization error:', error);
                document.getElementById('message').innerHTML = '<div class="error-message">⚠️ Failed to initialize payment form. Please try again.</div>';
            }
        }
        
        initialize();
        
        // Handle form submission
        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitButton = document.getElementById('submit-button');
            const loading = document.getElementById('loading');
            const messageDiv = document.getElementById('message');
            
            submitButton.disabled = true;
            loading.style.display = 'block';
            messageDiv.innerHTML = '';
            
            try {
                // Create payment method
                const { error, paymentMethod } = await stripe.createPaymentMethod({
                    type: 'card',
                    card: cardElement,
                    billing_details: {
                        name: planData.customerName,
                        email: planData.customerEmail
                    }
                });
                
                if (error) {
                    throw new Error(error.message);
                }
                
                // Create installment plan
                const response = await fetch('/api/installments/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: planData.sessionId,
                        totalAmount: planData.totalAmount,
                        cadence: planData.cadence,
                        startDate: planData.startDate,
                        numberOfPayments: planData.numberOfPayments,
                        customerEmail: planData.customerEmail,
                        customerName: planData.customerName,
                        paymentMethodId: paymentMethod.id
                    })
                });
                
                const result = await response.json();
                
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to create payment plan');
                }
                
                // Success!
                messageDiv.innerHTML = '<div class="success-message">✅ Automated billing set up successfully! Redirecting...</div>';
                sessionStorage.removeItem('pendingInstallmentPlan');
                
                setTimeout(() => {
                    window.location.href = '/app';
                }, 2000);
                
            } catch (error) {
                console.error('Payment setup error:', error);
                messageDiv.innerHTML = `<div class="error-message">⚠️ ${error.message}</div>`;
                submitButton.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>

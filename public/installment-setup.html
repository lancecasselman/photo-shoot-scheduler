<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Setup - Automated Billing</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: #2d2d2d;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        h1 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        
        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .plan-summary {
            background: rgba(212,175,55,0.1);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .plan-summary h3 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .plan-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .plan-detail:last-child {
            border-bottom: none;
        }
        
        .label {
            color: #aaa;
        }
        
        .value {
            color: #fff;
            font-weight: 500;
        }
        
        #payment-element {
            background: #1a1a1a;
            padding: 15px;
            border: 2px solid rgba(212,175,55,0.3);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        #payment-errors {
            color: #ff4444;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4bc 100%);
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212,175,55,0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #d4af37;
        }
        
        .error-message {
            background: rgba(255,68,68,0.1);
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #ff4444;
        }
        
        .success-message {
            background: rgba(76,175,80,0.1);
            border: 1px solid #4CAF50;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Automated Payment Setup</h1>
        <p class="subtitle">Set up automated billing for your payment plan</p>
        
        <div class="plan-summary" id="planSummary">
            <h3>📋 Payment Plan Details</h3>
            <div class="plan-detail">
                <span class="label">Total Amount:</span>
                <span class="value" id="totalAmount">-</span>
            </div>
            <div class="plan-detail">
                <span class="label">Payment Frequency:</span>
                <span class="value" id="cadence">-</span>
            </div>
            <div class="plan-detail">
                <span class="label">Total Payments:</span>
                <span class="value" id="totalPayments">-</span>
            </div>
            <div class="plan-detail">
                <span class="label">Payment Amount:</span>
                <span class="value" id="paymentAmount">-</span>
            </div>
            <div class="plan-detail">
                <span class="label">First Payment:</span>
                <span class="value" id="firstPayment">-</span>
            </div>
        </div>
        
        <form id="payment-form">
            <label for="payment-element" style="display: block; margin-bottom: 10px; color: #d4af37; font-weight: 600;">
                💳 Payment Method & Billing Details
            </label>
            <div id="payment-element"></div>
            <div id="payment-errors" role="alert"></div>
            
            <button type="submit" class="btn" id="submit-button">
                Set Up Automated Billing
            </button>
        </form>
        
        <div class="loading" id="loading">
            <p>⏳ Setting up your automated payment plan...</p>
        </div>
        
        <div id="message"></div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const planId = urlParams.get('planId');
        const setupIntentFromUrl = urlParams.get('setup_intent');
        const setupIntentClientSecret = urlParams.get('setup_intent_client_secret');
        
        let planData = {};
        let setupIntentId = null;
        let connectedAccountId = null;
        
        if (!planId) {
            document.getElementById('message').innerHTML = '<div class="error-message">⚠️ Invalid payment plan link. Please contact your photographer for a new link.</div>';
            document.getElementById('payment-form').style.display = 'none';
        }
        
        let stripe, elements, paymentElement;
        
        async function initialize() {
            try {
                const keyResponse = await fetch('/api/stripe-publishable-key');
                const { publishableKey } = await keyResponse.json();
                
                stripe = Stripe(publishableKey);
                
                if (setupIntentFromUrl && setupIntentClientSecret) {
                    console.log('🔄 Detected 3DS redirect, completing setup...');
                    await handle3DSRedirect();
                    return;
                }
                
                const planResponse = await fetch(`/api/installments/plan/${planId}`);
                
                if (!planResponse.ok) {
                    throw new Error('Payment plan not found or expired');
                }
                
                planData = await planResponse.json();
                
                connectedAccountId = planData.connectedAccountId;
                
                document.getElementById('totalAmount').textContent = `$${planData.totalAmount}`;
                document.getElementById('cadence').textContent = planData.cadence.charAt(0).toUpperCase() + planData.cadence.slice(1);
                document.getElementById('totalPayments').textContent = planData.numberOfPayments;
                document.getElementById('paymentAmount').textContent = `$${planData.perInstallmentAmount}`;
                document.getElementById('firstPayment').textContent = new Date(planData.startDate).toLocaleDateString();
                
                const setupIntentResponse = await fetch(`/api/installments/plan/${planId}/setup-intent`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!setupIntentResponse.ok) {
                    const error = await setupIntentResponse.json();
                    throw new Error(error.error || 'Failed to create setup intent');
                }
                
                const { clientSecret, connectedAccountId: accountId, usePlatformAccount, planData: billingData } = await setupIntentResponse.json();
                
                if (accountId && accountId !== connectedAccountId) {
                    console.warn(`⚠️  Account ID mismatch: plan has ${connectedAccountId}, setup-intent returned ${accountId}`);
                }
                
                console.log(`💳 Using ${usePlatformAccount ? 'PLATFORM' : 'CONNECTED'} account${accountId ? ': ' + accountId : ''}`);
                
                elements = stripe.elements({
                    clientSecret,
                    appearance: {
                        theme: 'night',
                        variables: {
                            colorPrimary: '#d4af37',
                            colorBackground: '#1a1a1a',
                            colorText: '#f5f5f5',
                            colorDanger: '#ff4444',
                            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                            borderRadius: '8px'
                        }
                    }
                });
                
                paymentElement = elements.create('payment', {
                    fields: {
                        billingDetails: {
                            name: 'auto',
                            email: 'auto',
                            address: {
                                country: 'never',
                                postalCode: 'auto'
                            }
                        }
                    },
                    defaultValues: {
                        billingDetails: {
                            name: billingData.customerName,
                            email: billingData.customerEmail
                        }
                    }
                });
                
                paymentElement.mount('#payment-element');
                
            } catch (error) {
                console.error('Initialization error:', error);
                document.getElementById('message').innerHTML = `<div class="error-message">⚠️ Failed to initialize payment form: ${error.message}</div>`;
            }
        }
        
        async function handle3DSRedirect() {
            try {
                document.getElementById('payment-form').style.display = 'none';
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerHTML = '<p>⏳ Completing payment setup...</p>';
                
                const planResponse = await fetch(`/api/installments/plan/${planId}`);
                if (!planResponse.ok) {
                    throw new Error('Payment plan not found');
                }
                
                planData = await planResponse.json();
                
                connectedAccountId = planData.connectedAccountId;
                
                document.getElementById('totalAmount').textContent = `$${planData.totalAmount}`;
                document.getElementById('cadence').textContent = planData.cadence.charAt(0).toUpperCase() + planData.cadence.slice(1);
                document.getElementById('totalPayments').textContent = planData.numberOfPayments;
                document.getElementById('paymentAmount').textContent = `$${planData.perInstallmentAmount}`;
                document.getElementById('firstPayment').textContent = new Date(planData.startDate).toLocaleDateString();
                
                console.log(`🔄 Retrieving SetupIntent after 3DS for ${connectedAccountId ? 'CONNECTED' : 'PLATFORM'} account${connectedAccountId ? ': ' + connectedAccountId : ''}`);
                
                let setupIntent;
                if (connectedAccountId) {
                    setupIntent = await stripe.retrieveSetupIntent(setupIntentClientSecret, {
                        stripeAccount: connectedAccountId
                    });
                } else {
                    setupIntent = await stripe.retrieveSetupIntent(setupIntentClientSecret);
                }
                
                console.log('✅ Retrieved SetupIntent after 3DS:', setupIntent.setupIntent.id, 'Status:', setupIntent.setupIntent.status);
                
                if (setupIntent.setupIntent.status === 'succeeded') {
                    const response = await fetch(`/api/installments/plan/${planId}/attach-payment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            setupIntentId: setupIntent.setupIntent.id
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (!response.ok || !result.success) {
                        throw new Error(result.error || 'Failed to complete payment setup');
                    }
                    
                    document.getElementById('message').innerHTML = '<div class="success-message">✅ Automated billing set up successfully! You will be charged automatically on each payment date.</div>';
                    document.getElementById('loading').style.display = 'none';
                } else if (setupIntent.setupIntent.status === 'requires_payment_method') {
                    throw new Error('Payment authentication failed. Please try again with a different payment method.');
                } else {
                    throw new Error(`Payment setup incomplete. Status: ${setupIntent.setupIntent.status}`);
                }
                
            } catch (error) {
                console.error('3DS redirect error:', error);
                document.getElementById('message').innerHTML = `<div class="error-message">⚠️ ${error.message}</div>`;
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        initialize();
        
        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitButton = document.getElementById('submit-button');
            const loading = document.getElementById('loading');
            const messageDiv = document.getElementById('message');
            const errorsDiv = document.getElementById('payment-errors');
            
            submitButton.disabled = true;
            loading.style.display = 'block';
            messageDiv.innerHTML = '';
            errorsDiv.textContent = '';
            
            try {
                const confirmOptions = {
                    elements,
                    confirmParams: {
                        return_url: window.location.href
                    },
                    redirect: 'if_required'
                };
                
                let result;
                if (connectedAccountId) {
                    console.log(`🔗 Confirming setup with connected account: ${connectedAccountId}`);
                    result = await stripe.confirmSetup(confirmOptions, {
                        stripeAccount: connectedAccountId
                    });
                } else {
                    console.log(`💳 Confirming setup with platform account`);
                    result = await stripe.confirmSetup(confirmOptions);
                }
                
                const { error, setupIntent } = result;
                
                if (error) {
                    throw new Error(error.message);
                }
                
                if (setupIntent.status !== 'succeeded') {
                    throw new Error('Payment setup was not completed');
                }
                
                setupIntentId = setupIntent.id;
                console.log('✅ SetupIntent confirmed:', setupIntentId);
                
                const response = await fetch(`/api/installments/plan/${planId}/attach-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        setupIntentId: setupIntentId
                    })
                });
                
                const apiResult = await response.json();
                
                if (!response.ok || !apiResult.success) {
                    throw new Error(apiResult.error || 'Failed to set up automated billing');
                }
                
                messageDiv.innerHTML = '<div class="success-message">✅ Automated billing set up successfully! You will be charged automatically on each payment date.</div>';
                
                document.getElementById('payment-form').style.display = 'none';
                loading.style.display = 'none';
                
            } catch (error) {
                console.error('Payment setup error:', error);
                messageDiv.innerHTML = `<div class="error-message">⚠️ ${error.message}</div>`;
                submitButton.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
